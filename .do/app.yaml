name: aeroflow-website
region: tor
static_sites:
  - name: website
    environment_slug: node-js
    github:
      repo: OmniNull/OmniWM
      branch: main
      deploy_on_push: true
    source_dir: website
    output_dir: dist
    error_document: 404.html
domains:
  - domain: aeroflow.app
    type: PRIMARY
    minimum_tls_version: "1.2"
  - domain: www.aeroflow.app
    type: ALIAS
    minimum_tls_version: "1.2"
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - match:
        authority:
          exact: www.aeroflow.app
        path:
          prefix: /
      redirect:
        authority: aeroflow.app
        scheme: https
        redirect_code: 308
    - match:
        authority:
          exact: ${STARTER_DOMAIN}
        path:
          prefix: /
      redirect:
        authority: aeroflow.app
        scheme: https
        redirect_code: 308
    - component:
        name: website
      match:
        path:
          prefix: /
